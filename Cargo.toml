[package]
name = "kreta-tui"
version = "0.1.1"
edition = "2024"
description = "Terminal client for the Hungarian e-KRÉTA school system"
license = "MIT"
repository = "https://github.com/DarkAaronfox/kreta-tui"

[[bin]]
name = "kreta"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
urlencoding = "2.1.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
