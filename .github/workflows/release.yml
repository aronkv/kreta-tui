name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Built on 22.04 so the binary runs on glibc 2.35+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: tar -czf kreta-${{ matrix.target }}.tar.gz -C target/release kreta
      - uses: softprops/action-gh-release@v2
        with:
          files: kreta-${{ matrix.target }}.tar.gz
          generate_release_notes: true
